<!doctype html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
  </head>

  <body>
    <div id="profile-selector"></div>
    <header id="header"></header>

    <section id="content">
      <div id="error"></div>
      <div id="featured-movies"></div>
      <div class="movie">
        <div id="movie-list" class="movie__list grid-context gap-m">
          <!-- Les cartes de films movie-card -->
        </div>
      </div>
      <div
        id="movie-detail"
        class="movie__cards-detail flex-context flex-column align-center gap-m"
      ></div>
    </section>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";

      import { MovieCategory } from "./component/MovieCategory/script.js";

      import { MovieDetail } from "./component/MovieDetail/script.js";
      import { DataMovie } from "./data/dataMovie.js";
      import { Notif } from "./component/Error/script.js";
      import { ProfileSelector } from "./component/ProfileSelector/script.js";
      import { DataProfile } from "./data/dataProfile.js";
      import { DataFavorite, HOST_URL } from "./data/dataFavorite.js";
      import { FeaturedMovies } from "./component/FeaturedMovies/script.js";

      // Controleur
      // Rappel, écrire window.C plutôt que let C est nécessaire pour tester depuis la console du navigateur
      // Une fois l'application terminée, on pourrait remettre let C.
      window.C = {};

      C.activeProfileId = null;
      C.activeProfileName = null;

      C.handlerAbout = async function () {
        await C.handlerMovies();
      };

      C.handlerMovies = async function () {
        let age = Number(C.activeProfileMinAge) || 0; // Utilise l'âge minimum du profil actif ou 0 si aucun profil n'est actif, Number() sinon le site ne le détecte pas comme un nombre et ça foire pour les films
        let filmsParCategorie =
          await DataMovie.requestMoviesGroupedByCategory(age);
        let featuredMovies = await DataMovie.requestFeaturedMovies(); // Récupère les films mis en avant
        if (featuredMovies === false) {
          Notif.show("Pas de films mis en avant disponibles pour le moment.");
          return;
        }
        console.log("Age du profil:", age); //console log pour comprendre pourquoi le mess d'erreur pas affiché
        console.log("Films par catégorie:", filmsParCategorie);
        let isEmpty = Object.keys(filmsParCategorie).length === 0;
        console.log("Aucun film ?", isEmpty);
        if (isEmpty) {
          console.log("Affichage message d'absence de film");
          Notif.show("Aucun film disponible pour le moment.");
        }

        let favorites = [];
        if (C.activeProfileId) {
          favorites = await DataFavorite.read(C.activeProfileId);
        }
        let favoriteIds = [];
        for (let i = 0; i < favorites.length; i++) {
          favoriteIds[i] = String(favorites[i].id);
        }

        V.renderMovies(filmsParCategorie, favoriteIds);
        V.clearMovieDetail();
        V.renderFeaturedMovies(featuredMovies, favoriteIds); // Affiche les films mis en avant avec leurs états favoris
      };

      C.handlerMovieDetail = async function (id) {
        let film = await DataMovie.requestMovieDetail(id);

        if (!film) {
          Notif.show("Impossible de charger les détails de ce film.");
          return;
        }

        V.renderMovieDetail(film);
      };

      C.handlerSelectProfile = function (element) {
        // `element` est la carte cliquée, reçue via `this` depuis le template.
        C.activeProfileId = element.dataset.id;
        C.activeProfileName = element.dataset.name;
        C.activeProfileMinAge = element.dataset.minAge; // Initialisation de l'âge minimum du profil actif

        V.hideProfileSelector(); // on cache l'overlay
        V.renderNavBar("C.handlerAbout()", C.activeProfileName); // navbar avec le nom du profil
        C.handlerMovies(); // on charge les films
      };

      // Appelé quand on clique sur "Changer" dans la navbar
      C.handlerSwitchProfile = async function () {
        C.activeProfileId = null;
        C.activeProfileName = null;
        C.activeProfileMinAge = null; // Réinitialisation de l'âge minimum du profil actif

        let profiles = await DataProfile.read();
        V.renderProfileSelector(profiles); // on réaffiche l'overlay
      };

      // Gère l'ajout/suppression d'un film aux favoris
      C.handlerAddFavorite = async function (id_movie) {
        // Récupère la checkbox correspondant au film via son ID
        // Note: On utilise des IDs uniques (favorite-123, favorite-456...) pour retrouver facilement chaque checkbox
        // sinon erreur  cannot read property 'checked' of null car il ne trouve pas la checkbox à cocher ou décocher
        let checkbox = document.getElementById("favorite-" + id_movie);

        // Si la checkbox est cochée, le film est ajouté aux favoris
        if (checkbox.checked) {
          let res = await DataFavorite.add(C.activeProfileId, id_movie);
          // Affiche le message de confirmation
          Notif.show(res);
        }
        // Sinon, le film est supprimé des favoris
        else {
          let res = await DataFavorite.remove(C.activeProfileId, id_movie);
          // Affiche le message de confirmation
          Notif.show(res);
          // Recharge la liste des films favoris pour mettre à jour l'affichage
          C.handlerFavorites();
        }
      };

      C.handlerFavorites = async function () {
        // Récupère les favoris du profil actif
        let favorites = await DataFavorite.read(C.activeProfileId);
        console.log("Favoris récupérés:", favorites);

        // Si aucun favori, affiche un message
        if (favorites.length == 0) {
          V.renderMovies({}, []);
          Notif.show("Votre liste de favoris est vide.");
          return;
        }

        // Normalise les données des favoris (ajoute les URLs d'images et le titre)
        for (let i = 0; i < favorites.length; i++) {
          favorites[i].titre = favorites[i].name;
          favorites[i].image =
            HOST_URL + "/server/images/" + favorites[i].image;
          // Assure que la catégorie existe
          if (!favorites[i].category) {
            favorites[i].category = "Sans catégorie";
          }
        }

        // Regroupe les favoris par catégorie
        let moviesByCategory = {};
        for (let i = 0; i < favorites.length; i++) {
          let category = favorites[i].category;

          // Initialise la catégorie si elle n'existe pas
          if (!moviesByCategory[category]) {
            moviesByCategory[category] = [];
          }

          // Ajoute le film à sa catégorie
          let catCount = moviesByCategory[category].length;
          moviesByCategory[category][catCount] = favorites[i];
        }

        // Crée la liste des IDs des favoris pour cocher les checkboxes
        let favoriteIds = [];
        for (let i = 0; i < favorites.length; i++) {
          favoriteIds[i] = String(favorites[i].id);
        }

        // Affiche les favoris groupés par catégorie
        V.renderMovies(moviesByCategory, favoriteIds);
        V.clearMovieDetail();
      };

      C.start = async function () {
        let profiles = await DataProfile.read(); // obligé de mettre async pour pouvoir mettre await sinon problème, ça ne lit pas et rien ne s'affiche
        V.renderProfileSelector(profiles);
      };

      // Vue (contient tout ce qui est relatif à l'affichage)
      window.V = {};

      /**
       * V.renderNavBar
       *
       * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
       * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
       * formaté par le composant NavBar.
       */
      V.renderNavBar = function (hAbout) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(
          hAbout,
          "C.handlerFavorites()",
          C.activeProfileName,
        );
      };

      V.renderMovies = function (filmsParCategorie, favoriteIds) {
        let movieList = document.querySelector("#movie-list");
        movieList.innerHTML = MovieCategory.format(
          filmsParCategorie,
          favoriteIds,
        );
      };

      V.renderProfileSelector = function (profiles) {
        let overlay = document.querySelector("#profile-selector");
        overlay.innerHTML = ProfileSelector.format(profiles);
      };

      V.hideProfileSelector = function () {
        let overlay = document.querySelector("#profile-selector");
        overlay.innerHTML = "";
      };

      V.renderMovieDetail = function (movie) {
        let movieDetail = document.querySelector("#movie-detail");
        movieDetail.innerHTML = MovieDetail.format(movie);
        let navbar = document.querySelector(".navbar");
        let navbarHeight = navbar ? navbar.offsetHeight : 0;

        document.getElementById("movie-detail").classList.add("active");
        document.getElementById("movie-list").classList.add("hidden");
        document.documentElement.style.setProperty(
          "--navbar-height",
          `${navbarHeight}px`, //re vérifier avec prof de css si c'est bien ça qu'il m'avait dit de faire
        );
        navbar?.classList.add("navbar--fixed");

        // Bouton fermer
        let closeBtn = document.querySelector(".movie__detail__close");
        closeBtn.addEventListener("click", V.clearMovieDetail);

        // Fermer en cliquant en dehors de la popup
        document
          .getElementById("movie-detail")
          .addEventListener("click", function (truc) {
            //pareil vérifier avec le prof de css voir si c'est qu'il voulait dire
            if (truc.target.id === "movie-detail") {
              V.clearMovieDetail();
            }
          });
      };

      V.clearMovieDetail = function () {
        let movieDetail = document.querySelector("#movie-detail");
        movieDetail.innerHTML = "";
        let navbar = document.querySelector(".navbar");

        document.getElementById("movie-detail").classList.remove("active");
        document.getElementById("movie-list").classList.remove("hidden");
        document.documentElement.style.setProperty("--navbar-height", "0px");
        navbar?.classList.remove("navbar--fixed");
      };

      V.renderFeaturedMovies = function (movies, favoriteIds = []) {
        if (!movies || movies.length === 0) return; // ← rien à afficher
        let container = document.querySelector("#featured-movies");
        container.innerHTML = FeaturedMovies.format(movies, favoriteIds);
      };

      C.start(); // Démarre l'application
    </script>
  </body>
</html>
<script type="module"></script>
