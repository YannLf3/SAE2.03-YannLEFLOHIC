<div class="movie__detail">
  <button class="movie__detail__close" aria-label="Fermer">&times;</button>
  <div class="movie__detail__media">
    <img
      class="movie__detail__poster"
      src="{{image}}"
      alt="Poster de {{name}}"
    />
  </div>
  {{newTag}}
  <div class="movie__detail__content">
    <p class="movie__detail__eyebrow">Fiche film</p>
    <h2 class="movie__detail__title">{{name}}</h2>
    <p class="movie__detail__meta movie__detail__meta--accent">
      Genre: {{category}}
    </p>
    <p class="movie__detail__meta">Réalisateur: {{director}}</p>
    <p class="movie__detail__meta">Année de sortie: {{releaseYear}}</p>
    <p class="movie__detail__description">{{description}}</p>
    <p class="movie__detail__meta">Âge minimal: {{min_age}}</p>
    <div class="movie__detail__trailer">
      <iframe
        class="movie__detail__video"
        src="{{trailer}}"
        title="Trailer de {{name}}"
        allowfullscreen
      ></iframe>
    </div>
  </div>
  <div id="movie-comments"></div>
  <div class="movie__detail__rating">
    <p class="movie__detail__rating-average">Note moyenne : {{average}} / 5</p>
    <div class="movie__detail__stars" id="rating-stars">{{stars}}</div>
  </div>
</div>
