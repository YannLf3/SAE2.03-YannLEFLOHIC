<!-- TEMPLATE_CARD -->
<div
  class="profile-card flex-context flex-column align-center"
  data-id="{{id}}"
  data-name="{{name}}"
  onclick="C.handlerSelectProfile(`{{id}}`, `{{name}}`)"
>
  <div
    class="profile-card__avatar flex-context align-center justify-center font-size-title"
  >
    {{avatar}}
  </div>
  <p class="profile-card__name font-sans font-size-name">{{name}}</p>
</div>
