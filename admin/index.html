<!doctype html>
<html lang="fr">
  <head>
    <title>SAE2.03 ADMINISTRATEUR</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
  </head>
  <body>
    <section id="log"></section>
    <section id="movieForm"></section>
    <section id="profileForm"></section>
    <section id="modifyProfileForm"></section>

    <script type="module">
      import { Log } from "./component/Log/script.js";

      import { MovieForm } from "./component/MovieForm/script.js";
      import { ProfileForm } from "./component/ProfileForm/script.js";
      import { DataMovie } from "./data/dataMovie.js";
      import { DataProfile } from "./data/dataProfile.js";
      import { ModifyProfileForm } from "./component/ModifyProfileForm/script.js";

      window.C = {};

      C.handlerAddMovie = async function () {
        let form = document.querySelector(".addFilm__form");
        if (form.reportValidity() == true) {
          let fd = new FormData(form);
          let res = await DataMovie.add(fd);
          V.renderLog(res);
        }
      };

      C.handlerAddProfile = async function () {
        let form = document.querySelector(".addProfile__form");
        let fd = new FormData(form);
        let res = await DataProfile.add(fd);
        V.renderLog(res);
      };

      C.handlerModifyProfile = async function () {
        let form = document.querySelector(".modifyProfile__form");
        let fd = new FormData(form);
        let res = await DataProfile.modify(fd);
        V.renderLog(res);
      };

      C.start = async function () {
        V.renderLog("Démarrage de l'application");
        let categories = await DataMovie.requestCategories();
        let profiles = await DataProfile.read();
        V.renderMovieForm("C.handlerAddMovie()", categories);
        V.renderProfileForm("C.handlerAddProfile()");
        V.renderModifyProfileForm("C.handlerModifyProfile()", profiles);
      };

      window.V = {};

      V.renderLog = function (txt) {
        let content = document.querySelector("#log");
        content.innerHTML = Log.format(txt);
      };

      V.renderMovieForm = function (handler, categories) {
        let content = document.querySelector("#movieForm");
        content.innerHTML = MovieForm.format(handler, categories);
      };

      V.renderProfileForm = function (handler) {
        let content = document.querySelector("#profileForm");
        content.innerHTML = ProfileForm.format(handler);
      };

      V.renderModifyProfileForm = function (handler, profiles) {
        let content = document.querySelector("#modifyProfileForm");
        content.innerHTML = ModifyProfileForm.format(handler, profiles);
      };

      C.start();
    </script>
  </body>
</html>
