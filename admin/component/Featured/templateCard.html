<div class="featured-search__card flex-context gap-m">
  <span class="featured-search__card-name">{{name}}</span>
  <span class="featured-search__card-category">{{category_name}}</span>
  <label class="featured-search__card-label">
    <input
      type="checkbox"
      data-id="{{id}}"
      {{checkedAttr}}
      id="featured-{{id}}"
    />
    Mis en avant
  </label>
</div>
