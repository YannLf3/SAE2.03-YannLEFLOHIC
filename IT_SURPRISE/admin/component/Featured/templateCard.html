<div class="featured-card">
  <img class="featured-card__image" src="{{image}}" alt="{{name}}" />
  <h3 class="featured-card__title">{{titre}}</h3>
  <p class="featured-card__category">{{category_name}}</p>
  <label class="featured-card__label">
    <input
      type="checkbox"
      class="featured-card__checkbox"
      data-id="{{id}}"
      id="featured-{{id}}"
      {{checkedAttr}}
    />
    Mis en avant
  </label>
</div>
